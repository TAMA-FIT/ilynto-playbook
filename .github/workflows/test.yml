name: Test reference implementations

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: templates/gpt-pc-bridge/mcp/package-lock.json
      - name: Install GPT-PC Bridge template dependencies
        run: npm ci --ignore-scripts --prefix templates/gpt-pc-bridge/mcp
      - name: Run reference and clean-room MCP tests
        run: npm test

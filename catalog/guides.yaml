usage_rule: >-
  Guides are optional post-install knowledge. Select only the guide/method that
  materially improves the current task. Do not turn the Playbook into a mandatory
  runtime dependency.

guides:
  - id: local-pc-memory-sharing
    title: Local PC Memory Sharing
    path: guides/local-pc-memory-sharing.md
    status: GUIDE
    goal: >-
      Share durable project state across ChatGPT/Codex/agent sessions through a
      private local memory directory accessible from the authorized local bridge.
    use_when:
      - multiple_chats_need_project_continuity
      - chatgpt_and_codex_need_shared_state
      - exact_handoff_and_decisions_must_survive_sessions
    core_artifacts:
      - PROJECT_STATE.json
      - CHECKPOINT.json
      - HANDOFF.md
      - DECISIONS.md_optional
      - CANONICAL_STATE.json
      - local_private_git
    invariants:
      - fresh_observable_state_outranks_memory
      - memory_is_separate_from_disposable_runtime
      - checkpoint_verified_semantic_outcomes_not_every_message
      - canonical_manifest_binds_one_generation
      - single_writer_per_physical_memory_root
      - atomic_writes_and_exact_path_commits
      - checkpoint_failure_does_not_replay_completed_work
      - never_put_secret_values_in_memory

